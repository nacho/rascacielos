[package]
name = "rascacielos"
version = "0.1.0"
edition = "2024"

#the board generator is ~10x faster in o2
[profile.release]
opt-level = 2

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_10"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_22"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
#for importing saves and highscores
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
#for generating the puzzles
fastrand = "2.4.1"

[build-dependencies]
glib-build-tools = "0.22"
