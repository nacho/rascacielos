[package]
name = "rascacielos"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_22"] }
#for logging with the GLib log macros
glib = { version = "0.22", features = ["log_macros"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
#for importing saves and highscores
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
#for generating the puzzles
fastrand = "2.4.1"

[build-dependencies]
glib-build-tools = "0.22"
